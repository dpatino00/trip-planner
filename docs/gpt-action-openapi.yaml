openapi: 3.1.0
info:
  title: Private Trip Companion
  version: 1.0.0
  description: Update one private shared trip through explicit operations.
servers:
  - url: https://YOUR_DEPLOYED_HOST
components:
  securitySchemes:
    actionKey:
      type: http
      scheme: bearer
  parameters:
    TripToken:
      name: X-Trip-Token
      in: header
      required: true
      description: Private trip token extracted from the user's link fragment. Never repeat it.
      schema: { type: string }
    PlaceId:
      name: placeId
      in: path
      required: true
      schema: { type: string }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string }
  schemas:
    MutationIdentity:
      type: object
      properties:
        version: { type: integer, minimum: 1 }
        mutationId: { type: string, format: uuid }
      required: [version, mutationId]
    Destination:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: Destination name. }
        locality: { type: [string, "null"] }
        countryCode: { type: [string, "null"] }
        coordinates:
          type: [object, "null"]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
          required: [latitude, longitude]
        timeZone: { type: [string, "null"] }
      required: [name, locality, countryCode, coordinates, timeZone]
security:
  - actionKey: []
paths:
  /api/actions/trip:
    get:
      operationId: getTripContext
      description: Retrieve the current trip context before making a mutation.
      parameters: [{ $ref: '#/components/parameters/TripToken' }]
      responses:
        '200': { description: Current trip context. }
  /api/actions/trip/destination:
    post:
      operationId: setTripDestination
      description: Set the trip destination using explicit structured context.
      parameters: [{ $ref: '#/components/parameters/TripToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/MutationIdentity' }
                - type: object
                  properties:
                    destination: { $ref: '#/components/schemas/Destination' }
                  required: [destination]
      responses:
        '200': { description: Updated destination. }
  /api/actions/trip/places:
    post:
      operationId: addPlace
      description: Save one user-requested place with optional enrichment.
      parameters: [{ $ref: '#/components/parameters/TripToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/MutationIdentity' }
                - type: object
                  properties:
                    place:
                      type: object
                      properties:
                        name: { type: string }
                        summary: { type: string }
                        locality: { type: [string, "null"] }
                        sourceUrl: { type: [string, "null"] }
                      required: [name]
                  required: [place]
      responses:
        '200': { description: Saved place and any warnings. }
  /api/actions/trip/places/{placeId}:
    patch:
      operationId: updatePlace
      description: Update allowlisted descriptive fields on one saved place.
      parameters:
        - { $ref: '#/components/parameters/TripToken' }
        - { $ref: '#/components/parameters/PlaceId' }
      responses:
        '200': { description: Updated place. }
  /api/actions/trip/preferences:
    post:
      operationId: setTripPreferences
      description: Replace the trip's complete preference set.
      parameters: [{ $ref: '#/components/parameters/TripToken' }]
      responses:
        '200': { description: Updated preferences. }
  /api/actions/trip/optimize:
    post:
      operationId: optimizeTrip
      description: Create a deterministic, reviewable plan proposal without applying it.
      parameters: [{ $ref: '#/components/parameters/TripToken' }]
      responses:
        '200': { description: Pending proposal or no-useful-change explanation. }
  /api/actions/trip/proposals/{proposalId}/apply:
    post:
      operationId: applyPlanProposal
      description: Apply a current proposal only after the user explicitly accepts that identified proposal.
      parameters:
        - { $ref: '#/components/parameters/TripToken' }
        - { $ref: '#/components/parameters/ProposalId' }
      responses:
        '200': { description: Explicitly accepted proposal applied atomically. }
